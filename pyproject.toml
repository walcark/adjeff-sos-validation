[project]
name = "sos-validation"
version = "0.1.0"
description = "Validate adjeff's radiative samplers against the SOS code."
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = ["adjeff", "matplotlib", "numpy", "xarray"]

[project.scripts]
sos-validate = "sos_validation.validate:main"
sos-plots = "sos_validation.plots:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >= 1.26"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
sos-validation = { path = ".", editable = true }
adjeff = { git = "https://github.com/walcark/Adjeff.git", tag = "v0.15.0" }
# Smart-G 2.0 is on PyPI only.
smartg = ">=2.0.1,<3"

# adjeff's conda-only dependencies, which installing it from git does not
# bring: luts and geoclide are not on PyPI, and pycuda's sdist needs the
# CUDA headers.
[tool.pixi.dependencies]
python = ">=3.11,<3.13"
geoclide = ">=4,<5"
luts = ">=1.0.6,<2"
pycuda = "*"
numpy = ">=2.0"
xarray = ">=2026.1.0"
matplotlib-base = ">=3.9"
# Compiles SOS.
gfortran = "*"
make = "*"
git = "*"

[tool.pixi.feature.gpu]
system-requirements = { cuda = "12.9" }
dependencies = { cuda-version = "12.9.*", pytorch-gpu = "*", cuda-cudart-dev = "12.9.*", cuda-nvcc = "12.9.*" }

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "*"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.11"

[tool.pixi.environments]
default = ["gpu", "dev"]
cpu = ["cpu", "dev"]

[tool.pixi.tasks]
build-sos = { cmd = "bash scripts/build_sos.sh" }
validate = { cmd = "sos-validate" }
plots = { cmd = "sos-plots" }

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest" }
lint = { cmd = "ruff check" }
fmt = { cmd = "ruff format" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
pydocstyle = { convention = "numpy" }
